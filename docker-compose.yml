services:
  mysql:
    image: mysql:8.0
    container_name: javarpa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: rpa
      # 应用专用账号，仅授 rpa 库权限（只在数据卷首次初始化时创建；存量卷可沿用 root 或手工建号）
      MYSQL_USER: ${MYSQL_APP_USER:-rpa}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-rpa123456}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 不携带凭据，避免密码进入进程列表/docker inspect；可连通即视为存活
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: javarpa-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-rpa_redis_dev}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
